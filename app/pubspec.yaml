name: geofinder
description: Koordynacja przeszukiwania terenu – wspólna mapa pokrycia i zgłoszenia.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  geolocator: ^13.0.1
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  flutter_local_notifications: ^17.2.4
  flutter_webrtc: ^1.6.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
